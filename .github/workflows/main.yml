name: Simulasyon
on: [push, pull_request, workflow_dispatch]
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Klasorleri duzenle
        run: |
          mkdir -p model rtl tb sim
          mv fp64_model.py aabb_model.py nurbs_model.py model/
          mv fp64_add.v fp64_mul.v vec_mat.v aabb.v nurbs.v rtl/
          mv tb_*.v tb/
          mv gen_vectors.py run_all.sh gen_aabb.py run_aabb.sh gen_nurbs.py run_nurbs.sh sim/
      - name: Icarus Verilog kur
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Python referans modelleri
        run: |
          python3 model/fp64_model.py
          python3 model/aabb_model.py
          python3 model/nurbs_model.py
      - name: Evre 1 testleri
        run: bash sim/run_all.sh
      - name: Evre 2 testleri
        run: bash sim/run_aabb.sh
      - name: Evre 3 testleri
        run: bash sim/run_nurbs.sh
